name: Deploy pull request preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: github.event.action != 'closed'
      - uses: pnpm/action-setup@v4
        if: github.event.action != 'closed'
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: github.event.action != 'closed'
      - name: Build pull request preview
        if: github.event.action != 'closed'
        run: |
          repository="${GITHUB_REPOSITORY#*/}"
          VITE_BASE_PATH="/${repository}/pr-preview/pr-${{ github.event.pull_request.number }}/" pnpm --filter @openstreet-racer/web build
      - uses: rossjrw/pr-preview-action@v1
        if: github.event.pull_request.head.repo.fork == false
        with:
          source-dir: apps/web/dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
          wait-for-pages-deployment: true
          deploy-commit-message: 'Deploy preview for PR ${{ github.event.pull_request.number }}'
          remove-commit-message: 'Remove preview for PR ${{ github.event.pull_request.number }}'
