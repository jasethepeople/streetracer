services:
  openstreet-racer:
    build: .
    ports:
      - '3001:3001'
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      OSM_CACHE_DIR: /app/.cache/openstreet-racer/osm
      PLAYER_DATA_DIR: /app/.data/openstreet-racer
      OSM_CONTACT_EMAIL: ${OSM_CONTACT_EMAIL:-}
      OSM_OVERPASS_URL: ${OSM_OVERPASS_URL:-}
    volumes:
      - osm-cache:/app/.cache/openstreet-racer/osm
      - player-data:/app/.data/openstreet-racer
    restart: unless-stopped

volumes:
  osm-cache:
  player-data:
